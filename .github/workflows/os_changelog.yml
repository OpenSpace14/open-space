name: OS Changelog Update

on:
  push:
    branches:
      - master
      - main

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[AUTO]') && !contains(toLowerCase(github.event.head_commit.message), '[maps]') && !contains(github.event.head_commit.message, '[IGNORE]')"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Update changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            const commitMessage = commit.commit.message;
            const commitAuthor = commit.author?.login || commit.commit.author.name;
            const commitDate = commit.commit.author.date;
            
            console.log('Commit message:', commitMessage);
            console.log('Commit author:', commitAuthor);
            console.log('Commit date:', commitDate);
            
            if (commitMessage.includes('[AUTO]') || commitMessage.toLowerCase().includes('[maps]') || commitMessage.includes('[IGNORE]')) {
              console.log('Skipping AUTO, Maps or IGNORE commit');
              return;
            }
            
            const typeRegex = /\[([^\]]+)\]/;
            const match = commitMessage.match(typeRegex);
            
            let changeType = 'Tweak';
            let message = commitMessage.split('\n')[0];
            
            if (match) {
              const typeString = match[1].toUpperCase();
              
              message = message.replace(typeRegex, '').trim();
              
              if (typeString.includes('ADD')) {
                changeType = 'Add';
              } else if (typeString.includes('FIX')) {
                changeType = 'Fix';
              } else if (typeString.includes('REMOVE') || typeString.includes('RMV')) {
                changeType = 'Remove';
              } else if (typeString.includes('TWEAK') || typeString.includes('UPD') || typeString.includes('UPDATE')) {
                changeType = 'Tweak';
              }
            }
            
            console.log('Change type:', changeType);
            console.log('Message:', message);
            
            const changelogPath = 'Resources/Changelog/Openspace.yml';
            let changelogData;
            
            try {
              const changelogContent = fs.readFileSync(changelogPath, 'utf8');
              changelogData = yaml.load(changelogContent);
            } catch (error) {
              console.log('Creating new changelog file');
              changelogData = {
                Name: 'OSlog',
                Order: -1,
                Entries: []
              };
            }
            
            const maxId = changelogData.Entries.length > 0 
              ? Math.max(...changelogData.Entries.map(e => e.id)) 
              : 0;
            
            const newEntry = {
              author: commitAuthor,
              changes: [
                {
                  type: changeType,
                  message: message
                }
              ],
              id: maxId + 1,
              time: commitDate
            };
            
            changelogData.Entries.push(newEntry);
            
            const formattedYaml = `Name: ${changelogData.Name}\nOrder: ${changelogData.Order}\nEntries:\n${yaml.dump(changelogData.Entries, { indent: 2, lineWidth: -1, noRefs: true })}`;
            
            fs.writeFileSync(changelogPath, formattedYaml, 'utf8');
            
            console.log('Changelog updated successfully');

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Resources/Changelog/Openspace.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[AUTO] Update OS Changelog"
            git push
          fi
